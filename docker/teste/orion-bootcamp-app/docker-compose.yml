networks:
  orion-bootcamp-app:
    name: orion-bootcamp-app
    driver: bridge

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "3000:80"
    depends_on:
      - angular-app
    networks:
      - orion-bootcamp-app

  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - orion-bootcamp-app