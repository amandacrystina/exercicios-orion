name: OrionDevEx4

services:
  app_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app_dev_ex4
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - db_mongo
      - db_postgres

  db_postgres:
    image: postgres:15-alpine
    container_name: postgres_dev_ex4
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  db_mongo:
    image: mongo:6-jammy
    container_name: mongo_dev_ex4
    env_file:
      - .env
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_dev_data:/data/db

volumes:
  postgres_dev_data:
  mongo_dev_data: